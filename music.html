<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WebSuite - Music Library</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="music-page">
<script src="static-api.js"></script>
<script src="auth.js"></script>
<aside class="sidebar"></aside>
<main class="main">
  <div class="music-hero">
    <h1>Music for every <span>moment.</span></h1>
    <p>Nikmati koleksi 1.000 lagu dari berbagai genre. Cari lagu, simpan favorit dan gunakan player untuk menikmati musik.</p>
  </div>
  <section class="card panel">
    <div class="toolbar">
      <div class="search-box"><input id="search" placeholder="🔎 Cari judul atau pencipta..." oninput="renderSongs()"></div>
      <select id="genre" class="select" style="max-width:180px" onchange="renderSongs()">
        <option value="">Semua Genre</option>
        <option>Pop</option><option>Rock</option><option>Jazz</option><option>Electronic</option>
        <option>Acoustic</option><option>Lo-Fi</option><option>Classical</option>
      </select>
      <button class="btn" onclick="shuffle()">🔀 Shuffle</button>
      <button class="btn" onclick="API.download('/songs/export','music-library.xlsx')">⬇ Excel</button>
    </div>
    <div class="panel-title"><h2>Music Library</h2><span id="counter">1.000 lagu</span></div>
    <div id="songList" class="song-list"></div>
  </section>
</main>

<div class="music-player">
  <div class="now-playing">
    <div class="now-cover">♪</div>
    <div class="now-info"><strong id="nowTitle">Belum ada lagu</strong><span id="nowArtist">Pilih lagu untuk mulai</span></div>
  </div>
  <div class="player-center">
    <div class="player-controls">
      <button onclick="previous()">⏮</button>
      <button id="mainPlay" class="main-play" onclick="togglePlay()">▶</button>
      <button onclick="next()">⏭</button>
    </div>
    <div class="player-progress" onclick="seek(event)"><div id="progress"></div></div>
  </div>
  <div class="volume">🔊 <input type="range" min="0" max="1" step=".01" value=".5" oninput="setVolume(this.value)"></div>
</div>
<script src="api.js"></script>
<script src="music.js"></script>
</body>
</html>
